# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=Smart Campus Placement System

# H2 Database Configuration (In-Memory, zero setup required, persists during session)
spring.datasource.url=jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=9a7f5c2d4e8b1a3c6e9d2f5a8b1c4e7d9a7f5c2d4e8b1a3c6e9d2f5a8b1c4e7d
jwt.expiration-ms=86400000

# ========================================================
# OPTIONAL: MySQL Database Configuration
# To use MySQL instead of H2, uncomment below and comment H2 lines:
# ========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/campus_placement?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
